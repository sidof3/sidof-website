<article
  class="card relative flex h-full flex-col p-4 focus-within:ring-2 focus-within:ring-brand-600"
  [attr.data-accent]="accent || null"
>
  <app-image-slot [src]="item.image" [alt]="item.imageAlt[lang.lang()]" [width]="800" [height]="600" />

  <div class="mt-4 flex flex-1 flex-col">
    @if (badge) {
      <span class="self-start rounded-full bg-gray-100 px-3 py-1 text-xs font-semibold text-ink">{{ badge }}</span>
    }
    <h3 class="mt-3 text-lg font-semibold">
      <a [routerLink]="link" class="after:absolute after:inset-0">{{ item.title[lang.lang()] }}</a>
    </h3>
    <p class="mt-1 text-sm text-muted">
      <i class="fa-solid fa-location-dot mr-2 text-accent" aria-hidden="true"></i>
      {{ item.neighborhood }}, {{ item.city }}
    </p>
    @if (facts.length) {
      <ul class="mt-3 flex flex-wrap gap-2 text-sm">
        @for (fact of facts; track fact) {
          <li class="rounded-lg bg-gray-100 px-2 py-1">{{ fact }}</li>
        }
      </ul>
    }
    @if (priceLabel) {
      <p class="mt-auto pt-4 text-lg font-bold text-ink">{{ priceLabel }}</p>
    }
  </div>
</article>
