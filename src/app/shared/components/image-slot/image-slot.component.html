@if (src) {
  <img
    [src]="src"
    [alt]="alt"
    [attr.width]="width"
    [attr.height]="height"
    [attr.loading]="priority ? 'eager' : 'lazy'"
    [attr.fetchpriority]="priority ? 'high' : null"
    decoding="async"
    class="h-auto w-full rounded-xl object-cover"
    [style.aspect-ratio]="width + ' / ' + height"
  />
} @else {
  <div
    class="flex w-full flex-col items-center justify-center gap-2 rounded-xl border-2 border-dashed border-gray-300 bg-gray-100 p-4 text-center text-sm text-muted"
    [style.aspect-ratio]="width + ' / ' + height"
  >
    <i class="fa-solid fa-image text-2xl" aria-hidden="true"></i>
    <span>Photo à ajouter</span>
    <span class="font-medium text-ink">{{ alt }}</span>
  </div>
}
